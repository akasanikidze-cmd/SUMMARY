 const cc=CE==t.i?`<textarea ${I} data-k="c" rows="3" placeholder="დაწერე კომენტარი...">${esc(t.c)}</textarea>`:t.c?`<div class="cmw" data-act="ec" ${I}><div class="cmt">${esc(t.c)}<small>${t.ct?t.ct.slice(0,10)+' · ':''}✎ რედაქტირება</small></div><div class="full">${esc(t.c)}<small>${t.ct?t.ct.slice(0,10)+' · ':''}✎ დააჭირე რედაქტირებისთვის</small></div></div>`:`<button class="ghost" data-act="ec" ${I}>+ კომენტარი</button>`;
 return `<div class="task ${late(t)?'late':''}" ${col(t)}><div class="tt1"><div title="${esc(t.t+(t.note?' — '+t.note:''))}"><b>${esc(t.t)}${em}</b><small>${esc(t.note)}${t.at?' · განახლდა '+t.at.slice(0,10):''}</small></div><div class="acts"><span class="chip ${f[0]}">${f[1]}</span><button class="ghost" data-act="et" ${I} title="სახელის, გუნდის და თემის შეცვლა">✎</button><button class="ghost" data-act="del" ${I} title="წაშლა">🗑</button></div></div>
<div class="meta"><label class="f"><b>ეფორტი (დღე)</b><input type="number" min="0" ${I} data-k="d" value="${t.d==null?'':t.d}" placeholder="?"></label><label class="f"><b>ღირებულება ₾</b><input type="number" min="0" ${I} data-k="v" value="${t.v>0?t.v:''}" placeholder="${t.v<0?'TBD':'—'}"></label></div>
<label class="f"><b>სტატუსი</b><select ${I} data-k="s">${ST.map(s=>`<option value="${s[0]}"${s[0]==t.s?' selected':''}>${s[1]}</option>`).join('')}</select></label>
<label class="f"><b>პროგრესი</b><span class="rg"><input type="range" min="0" max="100" step="5" ${I} data-k="p" value="${t.p}"><small>${t.p}%</small></span></label>
<label class="f"><b>დაწყება</b><input type="date" ${I} data-k="a" value="${t.a}"></label><label class="f"><b>ვადა</b><input type="date" ${I} data-k="b" value="${t.b}"></label>
<label class="f"><b>დაბლოკილი</b><input type="checkbox" ${I} data-k="k"${t.k?' checked':''}></label>
<div class="f cm"><b>კომენტარი</b>${cc}</div></div>`}).join('')).join('')+delList()}
function tl(a){const X=d=>Math.max(0,Math.min(100,dd('2026-10-01',d)/151*100)),M=[['ოქტ',31],['ნოე',30],['დეკ',31],['იან',31],['თებ',28]];

 grp(a).map(g=>`<div class="tr" ${col(g[0])}><div><b>${TM[g[0].team]} · ${esc(g[0].th)}</b> <span class="tag">${pct(g)}%</span></div><div class="lane"></div></div>`+g.map(t=>`<div class="tr" ${col(t)}><div title="${esc(t.t)}">&nbsp;&nbsp;${esc(t.t)}</div><div class="lane"><div class="seg ${late(t)?'late':''}" data-i="${t.i}" style="left:${X(t.a)}%;width:${Math.max(1,X(t.b)-X(t.a))}%"><i style="width:${t.p}%"></i><b class="hl" data-h="a"></b><b class="hr" data-h="b"></b></div><span class="dm" style="left:${X(t.b)}%"></span></div></div>`).join('')).join('')+
 `<div class="today" style="left:calc(var(--lw) + (100% - var(--lw))*${X(today)/100})"></div></div></div>`}

 else m.textContent='· ლოკალური რეჟიმი: ცვლილებები ინახება მხოლოდ ამ ბრაუზერში'})();
